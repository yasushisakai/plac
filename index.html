<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Placard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" id="theme" content="#17b0a7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overscroll-behavior: none;
    touch-action: manipulation;   /* iOS Safari ignores user-scalable=no; without this,
                                     double-tap zoom fights the app's only gesture */
    background: #17b0a7;
    font: 600 17px/1.3 system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Fixed layer so iOS rubber-banding never reveals white behind the colour. */
  #stage {
    position: fixed;
    inset: 0;
    background: #17b0a7;
    transition: background-color .18s ease;
    color: #000;                  /* the "ink": flipped to white on the dark stops */
  }

  #ui {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 0 28px calc(28px + env(safe-area-inset-bottom)) 28px;
    transition: opacity .18s ease;
  }
  body.held #ui { opacity: 0; pointer-events: none; }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    display: block;
    width: 100%;
    margin: 0;
    background: transparent;
    color: inherit;               /* form controls don't inherit colour: currentColor
                                     on the thumb would otherwise stay UA-default black */
    touch-action: none;           /* else the drag scrolls the page */
  }
  /* No opacity on the track: in WebKit the thumb inherits it and goes muddy. */
  input[type=range]::-webkit-slider-runnable-track {
    height: 8px; border-radius: 4px;
    background: var(--dim);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 46px; height: 46px; border-radius: 50%;
    background: currentColor;
    margin-top: -19px;
  }
  input[type=range]::-moz-range-track {
    height: 8px; border-radius: 4px;
    background: var(--dim);
  }
  input[type=range]::-moz-range-thumb {
    width: 46px; height: 46px; border: 0; border-radius: 50%;
    background: currentColor;
  }

  /* Colour emoji ignore currentColor and the dark/light ink flip, and opacity
     only mutes them — so this end row is left alone by paint(). */
  #ends {
    display: flex;
    justify-content: space-between;
    margin-top: 16px;
    font-size: 40px;
    line-height: 1;
  }
  #hint {
    margin-top: 22px;
    text-align: center;
    font-weight: 400;
    font-size: 15px;
    opacity: .5;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="ui">
    <input id="slider" type="range" min="0" max="4" step="1" value="2" aria-label="Your support">
    <div id="ends"><span role="img" aria-label="no">🤨👀</span><span role="img" aria-label="yes">👍</span></div>
    <div id="hint">tap to hold it up</div>
  </div>
</div>

<script>
// Five stops, dark to light. Lightness is monotonic, so the scale still reads
// as ordered with hue removed — which is what makes it colour-blind safe.
var STOPS = ['#071a5c', '#2e6bd6', '#17b0a7', '#ffb300', '#fff176'];

var stage  = document.getElementById('stage');
var slider = document.getElementById('slider');
var theme  = document.getElementById('theme');
var held   = false;

// WCAG relative luminance. The channels must be linearised first — comparing
// raw 0-255 values picks white on mid-tones where black is far more readable.
function luminance(hex) {
  var n = parseInt(hex.slice(1), 16);
  var c = [n >> 16 & 255, n >> 8 & 255, n & 255].map(function (v) {
    v /= 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}

function paint() {
  var c = STOPS[slider.value];
  var dark = luminance(c) < 0.179;          // WCAG white/black crossover
  stage.style.backgroundColor = c;
  stage.style.color = dark ? '#fff' : '#000';
  stage.style.setProperty('--dim', dark ? 'rgba(255,255,255,.35)' : 'rgba(0,0,0,.25)');
  document.body.style.background = c;
  theme.setAttribute('content', c);         // stops browser chrome breaking the bleed
}

// Screen must stay awake while it's over someone's head.
var lock = null;
async function wake() {
  if (!('wakeLock' in navigator) || lock) return;
  try {
    lock = await navigator.wakeLock.request('screen');
    lock.addEventListener('release', function () { lock = null; });
  } catch (e) { /* denied or unsupported: nothing to do */ }
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') wake();   // silently released when hidden
});

slider.addEventListener('input', function () { paint(); wake(); });

document.addEventListener('click', function (e) {
  if (!held && e.target === slider) return;   // adjusting, not holding up
  held = !held;
  document.body.classList.toggle('held', held);
  wake();
});

document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

paint();
</script>
</body>
</html>
